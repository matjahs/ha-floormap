# Primary live3d dashboard card (appartement Blender model).
# Export GLB + sidecar: npm run playground:blender
# (blender -b appartement.blend -P export_live3d.py)
#
# Fixture ids L01–L18 match Blender Lighting collections.
# HA entity ids come from Blender Object custom property `device_id`
# (exported as fixture.entity in appartement.scene.json). Card YAML owns
# groups / actions; the card merges Blender entity ids on load.
# Set edit_mode: true to drag lights on the card (YAML dashboards: export placements.json).
#
# Baked SunFlow / picture-elements overlays: see examples/baked-sunflow.yaml
# and homeassistant/dollhouse_card.yaml.
type: custom:sunflow-floorplan-card
title: Waalbandijk 469 — Level 10
scene_glb: /local/floorplan/appartement.glb
scene: /local/floorplan/appartement.scene.json
edit_mode: true
render:
  mode: live3d
  tone_map: aces
  exposure: 1.0
  gamma: 2.2
  transition: 400
  ambient: sun
  # appartement9: +X E-W, +Y N-S; export -blender.y → plan +Y = south; north 180 + mirror_x keep east on +X.
  north: 180
  mirror_x: true
  floor_level: 10
  floor_height_m: 3.05
  elevation_m: 32
floors:
  - level: blender-main
    camera: DollhouseCam
groups:
  kitchen:
    tap_action:
      action: toggle
  living:
    tap_action:
      action: toggle
entities:
  L01:
    entity: light.livingroom_light_3
    group: living
  L02:
    entity: light.ceiling_2
    group: living
  L03:
    entity: light.ceiling_1
    group: living
  L04:
    entity: light.livingroom_light_1
    group: living
  L05:
    entity: light.livingroom_light_5
    group: living
  L06:
    entity: light.kitchen_light_1
    group: kitchen
    tap_action:
      action: toggle
    hold_action:
      action: more-info
  L07:
    entity: light.kitchen_island_nanoleaf_light_strip
    group: kitchen
  L08:
    entity: light.kitchen_led_strip_pantry
    group: kitchen
  L09:
    entity: light.kitchen_led_strip_fridge_kitchen_ledstrip_2
    group: kitchen
  L10:
    entity: light.bedroom_2
  L11:
    entity: light.bedroom_1
  L12:
    entity: light.office_light_a
  L13:
    entity: light.office_light_b
  L14:
    entity: light.hallway_1_light
  L15:
    entity: light.hallway_2_light
  L16:
    entity: light.toilet_light
  L17:
    entity: light.bathroom
  L18:
    entity: light.utility_room
overrides: {}
