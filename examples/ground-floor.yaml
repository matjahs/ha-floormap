# Primary live3d dashboard card (Waalbandijk 2024 IR).
# Positions come from IR; optional /local/floorplan/placements.json overrides.
# Set edit_mode: true to drag lights on the card (YAML dashboards: export placements.json).
#
# Groups: membership on entities + optional groups.NAME with HA entity and/or tap_area polygon.
# Actions: tap_action / hold_action / double_tap_action (defaults: toggle / more-info / more-info).
# Strips: IR kind strip + optional segments with [0,1] fractions along the bar.
#
# Baked SunFlow path: see examples/baked-sunflow.yaml
type: custom:sunflow-floorplan-card
title: Waalbandijk 469 — Level 10
manifest: /local/floorplan/manifest.json
placements: /local/floorplan/placements.json
# Floorplanner dollhouse mesh (walls/furniture GLBs); lights still from SH3D manifest IR
fml: /local/floorplan/waalbandijk.fml.json
fml_assets: /local/floorplan/glb
fml_glb_map: /local/floorplan/waalbandijk.glb-map.json
edit_mode: true
render:
  mode: live3d
  tone_map: aces
  exposure: 1.0
  gamma: 2.2
  transition: 400
  ambient: sun
floors:
  - level: level-4fe4dcaf-d703-4406-a96f-c61e37dc9774
    camera: Bird View
groups:
  kitchen:
    # Optional HA light group / master for chip + tap_area actions
    # entity: light.kitchen
    tap_action:
      action: toggle
    # Stage % polygon — tap empty floor in this region to toggle the group
    tap_area:
      - [35, 35]
      - [55, 35]
      - [55, 55]
      - [35, 55]
  living:
    tap_action:
      action: toggle
entities:
  light_light-bb6f3724-d66f-4ed3-96c0-5c58b291f010:
    entity: light.hallway_1_light
  light_light-09aa8e87-fd5a-4a69-9a7c-6f307e5bf016:
    entity: light.hallway_2_light
  light_light-61dde89b-428f-4267-afce-8b74ca5805d7:
    entity: light.kitchen_light_1
    group: kitchen
    tap_action:
      action: toggle
    hold_action:
      action: more-info
  # Example strip with two WLED-style segments (fixture must be kind: strip in IR/overrides)
  light_light-82daac96-955d-481f-a387-80dad1df596e:
    entity: light.kitchen_led_strip
    group: kitchen
    segments:
      - entity: light.kitchen_led_strip_left
        start: 0.0
        end: 0.5
      - entity: light.kitchen_led_strip_right
        start: 0.5
        end: 1.0
  light_light-0132dd10-e80e-4d30-af07-a924d762af8e:
    entity: light.livingroom_light_3
    group: living
  light_light-bd58bf5c-2f47-4635-9c62-9bf0bb5bfb2c:
    entity: light.livingroom_light_5
    group: living
  light_light-6c843e68-6d03-4eb4-8989-0503a0c98294:
    entity: light.shelly_toilet_output_0
  light_light-f0faa71c-51bc-4e18-b4b9-4df94e30b994:
    entity: light.utility_room_1_light_3
  light_light-0db573a3-ff6d-4dd2-86ff-dc079dfd45db:
    entity: light.bedroom_1_light
  light_light-713e3443-e82b-4124-8d2a-a06ce6bee094:
    entity: light.office_light_1
overrides:
  light_light-82daac96-955d-481f-a387-80dad1df596e:
    kind: strip
    position: [900, 1100, 100]
    end: [1200, 1100, 100]
    samples: 8
